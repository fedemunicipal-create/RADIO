<!-- Cabecera fija con imagen adaptable -->
<div class="fixed-top-header">
    <img src="1000494291.png" alt="RadarLat Cabecera">
</div>

<!-- Espaciador obligatorio (Evita que las noticias se tapen) -->
<div class="header-spacer"></div>

<style>
    /* Estilos para la cabecera fija */
    .fixed-top-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: #000000;
        border-bottom: 1px solid #222222;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        box-sizing: border-box;
    }

    /* Estilos para que ocupe todo el ancho en celulares */
    .fixed-top-header img {
        width: 100% !important; /* Fuerza a ocupar todo el ancho disponible */
        height: auto !important; /* Mantiene la proporción para que no se deforme */
        display: block;
    }

    /* Espaciador dinámico que se calcula con Javascript */
    .header-spacer {
        background-color: #000000;
        width: 100%;
    }

    body {
        background-color: #000000 !important;
        margin: 0;
        padding: 0;
    }
</style>

<script>
    // Este pequeño script mide cuánto mide tu imagen en tiempo real y ajusta 
    // el espaciador automáticamente para que nunca tape tus noticias RSS.
    window.addEventListener('DOMContentLoaded', () => {
        const header = document.querySelector('.fixed-top-header');
        const spacer = document.querySelector('.header-spacer');
        if (header && spacer) {
            const resizeObserver = new ResizeObserver(entries => {
                for (let entry of entries) {
                    spacer.style.height = entry.target.clientHeight + 'px';
                }
            });
            resizeObserver.observe(header);
        }
    });
</script>
