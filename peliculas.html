<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RadarLat - Películas</title>
    <style>
        /* Configuración base del sistema oscuro */
        body {
            background-color: #000000 !important;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 1. SECCIÓN FIJA SUPERIOR (Banner + Menú Nav) */
        .fixed-top-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #000000;
            z-index: 9999;
            border-bottom: 1px solid #1a1a1a;
        }

        /* Banner adaptable */
        .fixed-top-section img {
            width: 100% !important;
            height: auto !important;
            display: block;
        }

        /* Menú de navegación fijo debajo del banner */
        .nav-menu {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #0a0a0a;
            padding: 12px 0;
            border-top: 1px solid #222;
        }

        .nav-menu a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: #ff0000;
        }

        /* Espaciador dinámico para que no se tape nada */
        .top-spacer {
            background-color: #000000;
            width: 100%;
        }

        /* 2. REPRODUCTOR DE VIDEO FIJO/ESTÁTICO */
        .video-container {
            max-width: 100%;
            margin: 15px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .video-player-wrapper {
            position: relative;
            padding-pb: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }

        .video-player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 3. CONTENEDOR DE CARRUSELES INFINITOS */
        .genres-container {
            padding: 10px 15px 30px 15px;
        }

        .genre-row {
            margin-bottom: 25px;
        }

        .genre-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #eee;
            letter-spacing: 0.5px;
            text-transform: capitalize;
        }

        /* Carrusel con desplazamiento infinito lateral táctil */
        .carousel-track {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px; /* Espacio para que la barra no tape el diseño */
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; /* Scroll ultra-fluido en iPhone/Android */
        }

        /* Ocultar barra de scroll estética en navegadores modernos */
        .carousel-track::-webkit-scrollbar {
            height: 4px;
        }
        .carousel-track::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 4px;
        }

        /* Tarjeta individual de película (puedes meter infinitas) */
        .movie-card {
            flex: 0 0 110px; /* Ancho fijo perfecto para portadas en celular */
            background: #0a0a0a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #111;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: scale(1.03);
            border-color: #333;
        }

        .movie-poster {
            width: 100%;
            height: 155px; /* Proporción estándar de póster vertical */
            object-fit: cover;
            background: #1a1a1a;
            display: block;
        }

        .movie-title {
            font-size: 11px;
            padding: 6px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Corta textos largos con "..." */
            color: #bbb;
        }
    </style>
</head>
<body>

    <!-- CABECERA DE LA PÁGINA (Se calcula sola con JS) -->
    <div class="fixed-top-section">
        <!-- Banner adaptable de Github -->
        <img src="TU_ENLACE_RAW_DE_GITHUB_AQUÍ" alt="RadarLat">
        
        <!-- Menú de navegación integrado debajo de la foto -->
        <div class="nav-menu">
            <a href="#" class="active">Inicio</a>
            <a href="#">Noticias</a>
            <a href="#">Películas</a>
            <a href="#">En Vivo</a>
        </div>
    </div>

    <!-- Espaciador dinámico inteligente -->
    <div class="top-spacer"></div>

    <!-- REPRODUCTOR DE VIDEO -->
    <div class="video-container">
        <div class="video-player-wrapper">
            <!-- Reemplaza el src con tu stream, archivo .mp4 o ID de video de YouTube/Vimeo -->
            <iframe src="https://youtube.com" allowfullscreen></iframe>
        </div>
    </div>

    <!-- SECCIÓN DE CATEGORÍAS (Copia y pega bloques para añadir infinitas) -->
    <div class="genres-container">

        <!-- BLOQUE: TERROR -->
        <div class="genre-row">
            <div class="genre-title">Terror</div>
            <div class="carousel-track">
                <!-- Película 1 -->
                <div class="movie-card">
                    <img src="https://placeholder.com" class="movie-poster" alt="Peli">
                    <div class="movie-title">El Conjuro</div>
                </div>
                <!-- Película 2 -->
                <div class="movie-card">
                    <img src="https://placeholder.com" class="movie-poster" alt="Peli">
                    <div class="movie-title">Siniestro</div>
                </div>
                <!-- Puedes copiar y pegar este bloque de película tantas veces como quieras horizontalmente... -->
            </div>
        </div>

        <!-- BLOQUE: ACCIÓN -->
        <div class="genre-row">
            <div class="genre-title">Acción</div>
            <div class="carousel-track">
                <div class="movie-card">
                    <img src="https://placeholder.com" class="movie-poster" alt="Peli">
                    <div class="movie-title">John Wick 4</div>
                </div>
                <div class="movie-card">
                    <img src="https://placeholder.com" class="movie-poster" alt="Peli">
                    <div class="movie-title">Mad Max</div>
                </div>
            </div>
        </div>

        <!-- BLOQUE: DRAMA -->
        <div class="genre-row">
            <div class="genre-title">Drama</div>
            <div class="carousel-track">
                <div class="movie-card">
                    <img src="https://placeholder.com" class="movie-poster" alt="Peli">
                    <div class="movie-title">Interstellar</div>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE AJUSTE AUTOMÁTICO DE ALTURA -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const header = document.querySelector('.fixed-top-section');
            const spacer = document.querySelector('.top-spacer');
            if (header && spacer) {
                const resizeObserver = new ResizeObserver(entries => {
                    for (let entry of entries) {
                        spacer.style.height = entry.target.clientHeight + 'px';
                    }
                });
                resizeObserver.observe(header);
            }
        });
    </script>
</body>
</html>
