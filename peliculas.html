<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RadarLat - Películas</title>
    <style>
        /* Configuración base del sistema oscuro */
        body {
            background-color: #000000 !important;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* ========================================================
           1. BLOQUE SUPERIOR 100% FIJO (Banner + Menú + Reproductor)
           ======================================================== */
        .fixed-top-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #000000;
            z-index: 9999;
            border-bottom: 1px solid #1a1a1a;
        }

        /* Banner adaptable de Github */
        .fixed-top-section img {
            width: 100% !important;
            height: auto !important;
            display: block;
        }

        /* Menú superior con tus estilos exactos */
        .radar-menu-superior {
            width: 100%;
            height: 58px !important; 
            min-height: 58px !important;
            max-height: 58px !important;
            background: #000000; 
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
            border-bottom: none !important; 
            border-top: 2px solid transparent !important; 
        }

        .radar-menu-superior .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .radar-menu-superior .nav-btn a {
            font-size: 0.85rem; 
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            text-transform: uppercase;
            font-family: sans-serif;
            color: #ffffff !important;
            text-decoration: none !important;
        }

        .radar-menu-superior .dot {
            width: 6px;
            height: 6px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-right: 6px;
            display: inline-block;
        }

        /* Contenedor del Reproductor Inmóvil */
        .video-container {
            max-width: 100%;
            padding: 5px 15px 15px 15px;
            box-sizing: border-box;
            background-color: #000000;
        }

        .video-player-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }

        .video-player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

       
        /* ========================================================
           2. SECCIÓN DE CONTENIDO MÓVIL (Carruseles abajo)
           ======================================================== */
        /* Espaciador dinámico automatizado */
        .top-spacer {
            background-color: #000000;
            width: 100%;
        }

        .genres-container {
            padding: 15px 15px 30px 15px;
        }

        .genre-row {
            margin-bottom: 25px;
        }

        .genre-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #eee;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Carrusel infinito lateral */
        .carousel-track {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-track::-webkit-scrollbar {
            height: 4px;
        }
        .carousel-track::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 4px;
        }

        /* Tarjeta de Película */
        .movie-card {
            flex: 0 0 110px;
            background: #0a0a0a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #111;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: scale(1.03);
            border-color: #333;
        }

        .movie-poster {
            width: 100%;
            height: 155px; 
            object-fit: cover;
            background: #1a1a1a;
            display: block;
        }

        .movie-title {
            font-size: 11px;
            padding: 6px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #bbb;
        }
    </style>
</head>
<body>

    <!-- BLOQUE COMPLETO ANCLADO ARRIBA -->
    <div class="fixed-top-section">
        <!-- Banner de GitHub -->
        <img src="1000494291.png" alt="RadarLat">
        
        <!-- Tu menú original -->
        <nav class="radar-menu-superior">
            <div class="nav-btn"><a href="deportes.html"><span class="dot"></span> DEPORTE</a></div>
            <div class="nav-btn"><a href="economia.html"><span class="dot"></span> ECONOMIA</a></div>
            <div class="nav-btn"><a href="peliculas.html"><span class="dot"></span> VOLVER</a></div>
        </nav>

        <!-- REPRODUCTOR SE MOVIÓ AQUÍ: Ahora es 100% fijo abajo del menú -->
        <div class="video-container">
            <div class="video-player-wrapper">
                <iframe id="main-player" src="https://youtube.com" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>
   
        <!-- Espaciador adaptativo (Evita de forma automática que los carruseles se escondan) -->
    <div class="top-spacer"></div>

    <!-- SECCIÓN DE CARRUSELES INFINITOS (Deslizan por debajo del reproductor) -->
    <div class="genres-container">

        <!-- GÉNERO 1: TERROR -->
        <div class="genre-row">
            <div class="genre-title">Terror</div>
            <div class="carousel-track">
                <div class="movie-card">
                    <img src="https://placeholder.com" class="movie-poster" alt="peli">
                    <div class="movie-title">el conjuro</div>
                </div>
                <div class="movie-card">
                    <img src="https://placeholder.com" class="movie-poster" alt="peli">
                    <div class="movie-title">Siniestro</div>
                </div>
            </div>
        </div>

        <!-- GÉNERO 2: ACCIÓN -->
        <div class="genre-row">
            <div class="genre-title">Acción</div>
            <div class="carousel-track">
                <div class="movie-card">
                    <img src="https://placeholder.com" class="movie-poster" alt="peli">
                    <div class="movie-title">John Wick 4</div>
                </div>
                <div class="movie-card">
                    <img src="https://placeholder.com" class="movie-poster" alt="peli">
                    <div class="movie-title">Mad Max</div>
                </div>
            </div>
        </div>

        <!-- GÉNERO 3: CIENCIA FICCION -->
        <div class="genre-row">
            <div class="genre-title">Ciencia Ficcion</div>
            <div class="carousel-track">
                <div class="movie-card" data-youtube="https://www.youtube.com/embed/6qiBk6oQ1RI?si=XC8GHzCyVdOvTUN7">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW5xsrUWyvm6lWqDuogdUZWnOBpKuUvYQKZA&s" class="movie-poster" alt="peli">
                    <div class="movie-title">Metropolis 1927</div>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPTS DE AJUSTE DE MEDIDAS -->
    <script>
        // Candado físico fijo en 58px para tu menú
        window.addEventListener('DOMContentLoaded', () => {
            const menuSuperior = document.querySelector('.radar-menu-superior');
            if (menuSuperior) {
                menuSuperior.style.height = '58px';
                menuSuperior.style.minHeight = '58px';
                menuSuperior.style.maxHeight = '58px';
            }
        });

        // Este script mide todo el bloque de arriba (Banner + Menú + Video)
        // y empuja los carruseles hacia abajo la distancia justa en cualquier celular
        window.addEventListener('DOMContentLoaded', () => {
            const header = document.querySelector('.fixed-top-section');
            const spacer = document.querySelector('.top-spacer');
            if (header && spacer) {
                const resizeObserver = new ResizeObserver(entries => {
                    for (let entry of entries) {
                        spacer.style.height = entry.target.clientHeight + 'px';
                    }
                });
                resizeObserver.observe(header);
            }
        });
    </script>
</body>
</html>
