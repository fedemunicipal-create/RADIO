<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADARLAT NOTICIAS</title>
    
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; padding-bottom: 120px; overflow-x: hidden; }
        #rl-container-fuerza { position: sticky; top: 0; width: 100%; background: #0b0e11; border-bottom: 2px solid #4CAF50; z-index: 2000; content-visibility: auto; contain-intrinsic-size: 0 62px; }
        .r1-carrusel-centrado { display: flex !important; flex-direction: row !important; overflow-x: auto !important; gap: 20px; padding: 10px 15px; align-items: center; -webkit-overflow-scrolling: touch; }
        .r1-carrusel-centrado::-webkit-scrollbar { display: none; }
        .btn-pais { flex: 0 0 auto; display: flex !important; flex-direction: column !important; align-items: center !important; min-width: 50px; cursor: pointer; background: transparent; border: none; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* Forzar el tamaño exacto de tus banderas al cargar tus links */
        .btn-pais img, .world-icon { width: 44px !important; height: 32px !important; border-radius: 6px; border: 2px solid transparent; object-fit: cover; display: block !important; }
        .btn-pais.active img, .btn-pais.active .world-icon { border-color: #4CAF50; box-shadow: 0 0 10px #4CAF50; }
        .btn-pais span { font-size: 10px; color: #777; margin-top: 5px; font-weight: bold; text-transform: uppercase; }
        .btn-pais.active span { color: #4CAF50; }
        
        /* Menú de Navegación Inferior Fijo e Inamovible */
        .radar-nav-bottom { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 3000; box-sizing: border-box; }
        .nav-btn { display: flex; align-items: center; justify-content: center; }
        .nav-btn a { font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; text-transform: uppercase; font-family: sans-serif; }
        
        /* Indicador táctico rojo parpadeante independiente */
        .dot { height: 8px; width: 8px; background-color: #ff0000; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #f00; animation: parpadeo 1.5s infinite; flex-shrink: 0; }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        /* ESTILO PARA EL BANNER DINÁMICO COMPLETAMENTE RESPONSIVO */
        .banner-radar {
            width: 100%;             
            max-width: 480px;        
            height: auto;            
            display: block;
            margin: 0 auto;          
            box-sizing: border-box;
            padding: 10px 15px;      
        }

        /* Contenedor para el contenido del index */
        .main-content { padding: 10px 0; }
        .rl-card { margin-bottom: 30px; display: block; }

        /* ======================================================================
           NUEVOS ESTILOS PARA EL TICKER EN EL INDEX (MOVIMIENTO VELOZ Y LEGIBLE)
           ====================================================================== */
        .rss-container {
            background: #0b0e11;
            padding: 12px 15px;
            border-bottom: 1px solid #222;
            border-top: 1px solid #222;
            min-height: 60px;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
            width: 100%;
            max-width: 600px; /* Alineado al ancho del contenido central */
            margin: 10px auto 20px auto;
        }
        .rss-header { font-size: 0.75rem; color: #4CAF50; font-weight: bold; margin-bottom: 4px; letter-spacing: 1px; display: flex; align-items: center; z-index: 2; }
        .rss-wrapper-ticker { overflow: hidden; width: 100%; white-space: nowrap; display: flex; position: relative; }
        .rss-ticker { font-size: 0.95rem; color: #adbeaf; display: inline-block; padding-left: 100%; animation: ticker-scroll-fast 16s linear infinite; }
        .rss-ticker:hover { animation-play-state: paused; } /* Pausa al tocar para leer con calma */
        .rss-ticker a { color: #00ff66; text-decoration: none; font-weight: bold; margin-right: 50px; display: inline-block; white-space: nowrap; }
        .rss-ticker a:hover { text-decoration: underline; }

        @keyframes ticker-scroll-fast {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- Menú Superior con tus Direcciones de Banderas Solicitadas Exactas -->
    <div id="rl-container-fuerza">
        <div class="r1-carrusel-centrado">
            <div class="btn-pais active" onclick="filtrarRadar('all', this)"><div class="world-icon" style="background:#222; display:flex; align-items:center; justify-content:center;">🌐</div><span>TODOS</span></div>
            <div class="btn-pais" onclick="filtrarRadar('ar', this)"><img src="https://flagcdn.com/w80/ar.png"><span>ARG</span></div>
            <div class="btn-pais" onclick="filtrarRadar('cl', this)"><img src="https://flagcdn.com/w80/cl.png"><span>CHI</span></div>
            <div class="btn-pais" onclick="filtrarRadar('uy', this)"><img src="https://flagcdn.com/w80/uy.png"><span>URU</span></div>
            <div class="btn-pais" onclick="filtrarRadar('py', this)"><img src="https://flagcdn.com/w80/py.png"><span>PAR</span></div>
            <div class="btn-pais" onclick="filtrarRadar('br', this)"><img src="https://flagcdn.com/w80/br.png"><span>BRA</span></div>
            <div class="btn-pais" onclick="filtrarRadar('pe', this)"><img src="https://flagcdn.com/w80/pe.png"><span>PER</span></div>
            <div class="btn-pais" onclick="filtrarRadar('bo', this)"><img src="https://flagcdn.com/w80/bo.png"><span>BOL</span></div>
            <div class="btn-pais" onclick="filtrarRadar('ec', this)"><img src="https://flagcdn.com/w80/ec.png"><span>ECU</span></div>
            <div class="btn-pais" onclick="filtrarRadar('ve', this)"><img src="https://flagcdn.com/w80/ve.png"><span>VEN</span></div>
            <div class="btn-pais" onclick="filtrarRadar('co', this)"><img src="https://flagcdn.com/w80/co.png"><span>COL</span></div>
            <div class="btn-pais" onclick="filtrarRadar('mx', this)"><img src="https://flagcdn.com/w80/mx.png"><span>MEX</span></div>
            <div class="btn-pais" onclick="filtrarRadar('pa', this)"><img src="https://flagcdn.com/w80/pa.png"><span>PAN</span></div>
            <div class="btn-pais" onclick="filtrarRadar('gt', this)"><img src="https://flagcdn.com/w80/gt.png"><span>GUA</span></div>
            <div class="btn-pais" onclick="filtrarRadar('sv', this)"><img src="https://flagcdn.com/w80/sv.png"><span>SAL</span></div>
            <div class="btn-pais" onclick="filtrarRadar('ni', this)"><img src="https://flagcdn.com/w80/ni.png"><span>NIC</span></div>
            <div class="btn-pais" onclick="filtrarRadar('hn', this)"><img src="https://flagcdn.com/w80/hn.png"><span>HON</span></div>
            <div class="btn-pais" onclick="filtrarRadar('cr', this)"><img src="https://flagcdn.com/w80/cr.png"><span>COS</span></div>

            <div class="btn-pais" onclick="filtrarRadar('de', this)"><img src="https://flagcdn.com/w80/de.png"><span>ALE</span></div>
        </div>
    </div>

    <!-- 🟢 AQUÍ QUEDÓ TU BANNER (Se desplaza de forma fluida y responsiva) -->
    
    <!-- Banner flexible de inicio -->
    <img src="banner.jpg" alt="RadarLat - Comando Unificado de Noticias" class="banner-radar">

    <!-- 🟢 NUEVO SECTOR DE NOTICIAS RSS AUTOMATIZADO -->
    <div class="rss-container">
        <div class="rss-header">
            <span class="dot"></span>RADAR DE INFORMACIÓN (<span id="radar-pais-tag">TODOS</span>)
        </div>
        <div class="rss-wrapper-ticker">
            <div id="ticker-target" class="rss-ticker">Sincronizando flujos y portales de noticias internacionales...</div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL: Aquí puedes colocar las tarjetas de accesos o portales -->
    <div class="main-content">

    <!-- CONTENEDOR PRINCIPAL: Aquí puedes colocar las tarjetas de accesos o portales -->
    <div class="main-content">
        <!-- Deja este espacio listo para tus bloques con la clase class="rl-card" data-pais="codigo" -->
    </div>
   
    <!-- Menú de Navegación Inferior Fijo -->
    <div class='radar-nav-bottom'>
      <div class='nav-btn active'><a href='https://fedemunicipal-create.github.io/RADIO/radio-vivo.html' style='color: #ffffff !important; text-decoration: none !important;'><span class='dot'></span> RADIO</a></div>
      <div class='nav-btn'><a href='https://fedemunicipal-create.github.io/RADIO/tv-vivo.html' style='color: #ffffff !important; text-decoration: none !important;'><span class='dot'></span> TV VIVO</a></div>
      <div class='nav-btn'><a href='https://radarlat.blogspot.com' style='color: #ffffff !important; text-decoration: none !important;'><span class='dot'></span> PORTALES</a></div>
    </div>

    <!-- SCRIPT DE AUTOMATIZACIÓN FILTRADO (Totalmente Corregido) -->
    <script>
    /**********************************************************************
     * 🟢 COLOCAR RSS AQUÍ DE FORMA SENCILLA E INTUITIVA
     * Mapeo de feeds para cada bandera de tu menú superior.
     **********************************************************************/
    const fuentesNoticiasRss = {
        all: 'https://google.com', // Global
        ar: 'https://api.allorigins.win/raw?url=https://www.lanoticia.ar/noticias/feed/',
        cl: 'https://biobiochile.cl',
        uy: 'https://elobservador.com.uy',
        py: 'https://abc.com.py',
        br: 'https://globo.com',
        pe: 'https://elcomercio.pe',
        bo: 'https://eldeber.com.bo',
        ec: 'https://eluniverso.com',
        ve: 'https://el-nacional.com',
        co: 'https://eltiempo.com',
        mx: 'https://eluniversal.com.mx',
        pa: 'https://prensa.com',
        gt: 'https://prensalibre.com',
        sv: 'https://elsalvador.com',
        ni: 'https://laprensa.com.ni',
        hn: 'https://elheraldo.hn',
        cr: 'https://nacion.com',
        cu: 'https://cubadebate.cu',
        do: 'https://listindiario.com',
        pr: 'https://elnuevodia.com',
        us: 'https://nytimes.com',
        es: 'https://elpais.com',
        fr: 'https://lemonde.fr',
        de: 'https://dw.com'
    };

    // MOTOR AUTOMÁTICO DE CONVERSIÓN Y CARGA RSS
    async function cargarSeñalRSS(codigoPais, etiquetaNombre) {
        const tickerTarget = document.getElementById('ticker-target');
        const tagPais = document.getElementById('radar-pais-tag');
        if (tagPais) tagPais.innerText = etiquetaNombre.toUpperCase();
        
        tickerTarget.innerHTML = "Estableciendo enlace satelital con los diarios...";
        
        const urlXml = fuentesNoticiasRss[codigoPais] || fuentesNoticiasRss['all'];
        const apiConversor = `https://rss2json.com{encodeURIComponent(urlXml)}`;

        try {
            const respuesta = await fetch(apiConversor);
            const datos = await respuesta.json();

            if (datos.status === 'ok' && datos.items.length > 0) {
                let bloqueTitulares = '';
                // Recopila hasta 12 titulares reales
                datos.items.slice(0, 12).forEach(item => {
                    const tituloLimpio = item.title.replace(/"/g, '&quot;');
                    bloqueTitulares += `<a href="${item.link}" target="_blank">⚡ ${tituloLimpio}</a>`;
                });
                tickerTarget.innerHTML = bloqueTitulares;
                
                // Reinicio de animación CSS para recalcular el largo del texto de forma fluida
                tickerTarget.style.animation = 'none';
                tickerTarget.offsetHeight; 
                tickerTarget.style.animation = 'ticker-scroll-fast 16s linear infinite';
            } else {
                tickerTarget.innerHTML = `<a>⚠️ No hay despachos informativos disponibles para ${etiquetaNombre}.</a>`;
            }
        } catch (error) {
            console.error("Falla RSS:", error);
            tickerTarget.innerHTML = `<a>⚠️ Error de red: Servidor de noticias fuera de rango.</a>`;
        }
    }

    // FUNCIÓN DE FILTRADO UNIFICADA TÁCTICA
    function filtrarRadar(codigoPais, elemento) {
        // Enciende la luz verde en la bandera presionada
        document.querySelectorAll('.btn-pais').forEach(btn => btn.classList.remove('active'));
        elemento.classList.add('active');
        
        // Filtra tus futuros bloques .rl-card en base al país
        const tarjetas = document.querySelectorAll('.rl-card');
        tarjetas.forEach(tarjeta => {
            if (codigoPais === 'all') {
                tarjeta.style.display = 'block';
            } else {
                tarjeta.style.display = (tarjeta.getAttribute('data-pais') === codigoPais) ? 'block' : 'none';
            }
        });

        // Sincroniza el ticker de noticias al país seleccionado
        const textoPais = elemento.querySelector('span').innerText;
        cargarSeñalRSS(codigoPais, textoPais);
    }

    // Arranque inicial en frío con noticias globales
    window.addEventListener('DOMContentLoaded', () => {
        const botonInicial = document.querySelector('.btn-pais.active');
        if (botonInicial) {
            filtrarRadar('all', botonInicial);
        }
    });
    </script>
