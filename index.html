<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADARLAT NOTICIAS</title>
    
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; padding-bottom: 120px; overflow-x: hidden; }
        #rl-container-fuerza { position: sticky; top: 0; width: 100%; background: #0b0e11; border-bottom: 2px solid #4CAF50; z-index: 2000; content-visibility: auto; contain-intrinsic-size: 0 62px; }
        .r1-carrusel-centrado { display: flex !important; flex-direction: row !important; overflow-x: auto !important; gap: 20px; padding: 10px 15px; align-items: center; -webkit-overflow-scrolling: touch; }
        .r1-carrusel-centrado::-webkit-scrollbar { display: none; }
        .btn-pais { flex: 0 0 auto; display: flex !important; flex-direction: column !important; align-items: center !important; min-width: 50px; cursor: pointer; background: transparent; border: none; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* Forzar el tamaño exacto de tus banderas al cargar tus links */
        .btn-pais img, .world-icon { width: 44px !important; height: 32px !important; border-radius: 6px; border: 2px solid transparent; object-fit: cover; display: block !important; }
        .btn-pais.active img, .btn-pais.active .world-icon { border-color: #4CAF50; box-shadow: 0 0 10px #4CAF50; }
        .btn-pais span { font-size: 10px; color: #777; margin-top: 5px; font-weight: bold; text-transform: uppercase; }
        .btn-pais.active span { color: #4CAF50; }
        
        /* Menú de Navegación Inferior Fijo e Inamovible */
        .radar-nav-bottom { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 3000; box-sizing: border-box; }
        .nav-btn { display: flex; align-items: center; justify-content: center; }
        .nav-btn a { font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; text-transform: uppercase; font-family: sans-serif; }
        
        /* Indicador táctico rojo parpadeante independiente */
        .dot { height: 8px; width: 8px; background-color: #ff0000; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #f00; animation: parpadeo 1.5s infinite; flex-shrink: 0; }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        /* ESTILO PARA EL BANNER DINÁMICO COMPLETAMENTE RESPONSIVO */
        .banner-radar {
            width: 100%;             
            max-width: 480px;        
            height: auto;            
            display: block;
            margin: 0 auto;          
            box-sizing: border-box;
            padding: 10px 15px;      
        }

        /* Contenedor para el contenido del index */
        .main-content { padding: 10px 0; }
        .rl-card { margin-bottom: 30px; display: block; }

        /* ======================================================================
           NUEVOS ESTILOS PARA EL TICKER EN EL INDEX (MOVIMIENTO VELOZ Y LEGIBLE)
           ====================================================================== */
        .rss-container {
            background: #0b0e11;
            padding: 12px 15px;
            border-bottom: 1px solid #222;
            border-top: 1px solid #222;
            min-height: 60px;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
            width: 100%;
            max-width: 600px; /* Alineado al ancho del contenido central */
            margin: 10px auto 20px auto;
        }
        .rss-header { font-size: 0.75rem; color: #4CAF50; font-weight: bold; margin-bottom: 4px; letter-spacing: 1px; display: flex; align-items: center; z-index: 2; }
        .rss-wrapper-ticker { overflow: hidden; width: 100%; white-space: nowrap; display: flex; position: relative; }
        .rss-ticker { font-size: 0.95rem; color: #adbeaf; display: inline-block; padding-left: 100%; animation: ticker-scroll-fast 16s linear infinite; }
        .rss-ticker:hover { animation-play-state: paused; } /* Pausa al tocar para leer con calma */
        .rss-ticker a { color: #00ff66; text-decoration: none; font-weight: bold; margin-right: 50px; display: inline-block; white-space: nowrap; }
        .rss-ticker a:hover { text-decoration: underline; }

        @keyframes ticker-scroll-fast {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* CONTEXTO PARA EL REPRODUCTOR AUTOMÁTICO 100% AJUSTADO AL CELULAR */
        .video-container { 
            width: 100%;             /* 👈 Obliga al video a ocupar todo el ancho del celular */
            max-width: 600px;        /* 👈 Pone un tope elegante para que no se desarme en la PC */
            aspect-ratio: 16/9;      /* 👈 Mantiene la proporción perfecta de televisión */
            background: #000; 
            margin: 15px auto;       /* 👈 Separa el video del ticker y lo centra */
            position: relative; 
            overflow: hidden; 
            border-bottom: 1px solid #222; /* 👈 Línea sutil abajo, igual que en tu sección de TV */
            box-sizing: border-box; 
        }
        #main-video-player, #hls-video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; z-index: 2; }
        #main-video-player.active, #hls-video-player.active { display: block; }
        
    </style>
</head>
<body>

    <!-- Menú Superior con tus Direcciones de Banderas Solicitadas Exactas -->

            <div class="btn-pais" onclick="filtrarRadar('pr', this)"><img src="https://flagcdn.com/w80/pr.png"><span>PUE</span></div>
            <div class="btn-pais" onclick="filtrarRadar('us', this)"><img src="https://flagcdn.com/w80/us.png"><span>USA</span></div>
            <div class="btn-pais" onclick="filtrarRadar('es', this)"><img src="https://flagcdn.com/w80/es.png"><span>ESP</span></div>
            <div class="btn-pais" onclick="filtrarRadar('fr', this)"><img src="https://flagcdn.com/w80/fr.png"><span>FRA</span></div>
            <div class="btn-pais" onclick="filtrarRadar('de', this)"><img src="https://flagcdn.com/w80/de.png"><span>ALE</span></div>
        </div>
    </div>

    <!-- 🟢 AQUÍ QUEDÓ TU BANNER (Se desplaza de forma fluida y responsiva) -->
    
    <!-- Banner flexible de inicio -->
    <img src="banner.jpg" alt="RadarLat - Comando Unificado de Noticias" class="banner-radar">

    <!-- 🟢 NUEVO SECTOR DE NOTICIAS RSS AUTOMATIZADO -->
    <div class="rss-container">
        <div class="rss-header">
            <span class="dot"></span>RADAR DE INFORMACIÓN (<span id="radar-pais-tag">TODOS</span>)
        </div>
        <div class="rss-wrapper-ticker">
            <div id="ticker-target" class="rss-ticker">Sincronizando flujos y portales de noticias internacionales...</div>
        </div>
    </div>
 <!-- NUEVO REPRODUCTOR DE VIDEO EMBEBIDO (DEBAJO DEL TICKER RSS) -->
     <div class="video-container">
        <iframe id="main-video-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <video id="hls-video-player" controls autoplay playsinline muted></video> <!-- 👈 Se le agregó la palabra 'muted' aquí -->
    </div>
    
    <!-- CONTENEDOR PRINCIPAL: Aquí puedes colocar las tarjetas de accesos o portales -->
    <div class="main-content">

    <!-- CONTENEDOR PRINCIPAL: Aquí puedes colocar las tarjetas de accesos o portales -->
    <div class="main-content">
        <!-- Deja este espacio listo para tus bloques con la clase class="rl-card" data-pais="codigo" -->
    </div>
   
    <!-- Menú de Navegación Inferior Fijo -->
    <div class='radar-nav-bottom'>
      <div class='nav-btn active'><a href='https://fedemunicipal-create.github.io/RADIO/radio-vivo.html' style='color: #ffffff !important; text-decoration: none !important;'><span class='dot'></span> RADIO</a></div>
      <div class='nav-btn'><a href='https://fedemunicipal-create.github.io/RADIO/tv-vivo.html' style='color: #ffffff !important; text-decoration: none !important;'><span class='dot'></span> TV VIVO</a></div>
      <div class='nav-btn'><a href='https://radarlat.blogspot.com' style='color: #ffffff !important; text-decoration: none !important;'><span class='dot'></span> PORTALES</a></div>
    </div>

  <script>
    // 🟢 CARGA AQUÍ TUS 10 CANALES (YouTube o señales directas .m3u8)
    const canalesRadarIndex = [
        { url: 'https://www.youtube.com/embed/VWhQ6xspnSc?autoplay=1&mute=1', tipo: 'youtube' }, // Canal 1 (C5N)
        { url: 'https://www.youtube.com/embed/AhBefTxKY-o?autoplay=1&mute=1', tipo: 'youtube' }, // Canal 2 (LatinaTV)
        { url: 'https://www.youtube.com/embed/cb12KmMMDJA?autoplay=1&mute=1', tipo: 'youtube' }, // Canal 3 (TN)
        { url: 'https://www.youtube.com/embed/O9mOtdZ-nSk?autoplay=1&mute=1', tipo: 'youtube' }, // Canal 4 (Euronews)
        { url: 'https://www.youtube.com/embed/Qr61waJ6AZg?autoplay=1&mute=1', tipo: 'youtube' }, // Canal 5 (CNN español)
        { url: 'https://www.youtube.com/embed/V4C7VNfRATA?autoplay=1&mute=1', tipo: 'youtube' }, // Canal 6 (N+Univision)
        { url: 'URL_AQUÍ', tipo: 'hls' },
        { url: 'URL_AQUÍ', tipo: 'hls' },
        { url: 'URL_AQUÍ', tipo: 'hls' },
        { url: 'URL_AQUÍ', tipo: 'hls' }
    ];

    function encenderCanalAleatorio() {
        const iframePlayer = document.getElementById('main-video-player');
        const hlsPlayer = document.getElementById('hls-video-player');

        // Elige una posición al azar de la lista superior
        const indiceAzar = Math.floor(Math.random() * canalesRadarIndex.length);
        const canalElegido = canalesRadarIndex[indiceAzar];

        if (canalElegido.tipo === 'youtube') {
            if (hlsPlayer) { hlsPlayer.classList.remove('active'); hlsPlayer.pause(); }
            if (iframePlayer) { iframePlayer.src = canalElegido.url; iframePlayer.classList.add('active'); }
        } else if (canalElegido.tipo === 'hls') {
            if (iframePlayer) { iframePlayer.classList.remove('active'); iframePlayer.src = ''; }
            if (hlsPlayer) { hlsPlayer.src = canalElegido.url; hlsPlayer.classList.add('active'); hlsPlayer.play().catch(e => console.log("Autoplay retenido")); }
        }
    }

    // Tu función original de filtrado que mantiene tus banderas y carruseles intactos
    function filtrarRadar(codigoPais, elemento) {
        document.querySelectorAll('.btn-pais').forEach(btn => btn.classList.remove('active'));
        elemento.classList.add('active');
        
        const tagPais = document.getElementById('radar-pais-tag');
        const tickerTarget = document.getElementById('ticker-target');
        const textoPais = elemento.querySelector('span').innerText;
        
        if (tagPais) tagPais.innerText = textoPais;
        if (tickerTarget) tickerTarget.innerHTML = `<a>Conectando flujos de información y portales de ${textoPais}...</a>`;

        const tarjetas = document.querySelectorAll('.rl-card');
        tarjetas.forEach(tarjeta => {
            if (codigoPais === 'all') {
                tarjeta.style.display = 'block';
            } else {
                tarjeta.style.display = (tarjeta.getAttribute('data-pais') === codigoPais) ? 'block' : 'none';
            }
        });
    }

    // Encendido automático del reproductor al cargar la pantalla
    window.addEventListener('DOMContentLoaded', () => {
        encenderCanalAleatorio();
    });
    </script>   
</body>
</html>
