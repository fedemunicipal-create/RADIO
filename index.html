    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; padding-bottom: 120px; overflow-x: hidden; }
        #rl-container-fuerza { position: sticky; top: 0; width: 100%; background: #0b0e11; border-bottom: 2px solid #4CAF50; z-index: 2000; content-visibility: auto; contain-intrinsic-size: 0 62px; }
        .r1-carrusel-centrado { display: flex !important; flex-direction: row !important; overflow-x: auto !important; gap: 20px; padding: 10px 15px; align-items: center; -webkit-overflow-scrolling: touch; }
        .r1-carrusel-centrado::-webkit-scrollbar { display: none; }
        .btn-pais { flex: 0 0 auto; display: flex !important; flex-direction: column !important; align-items: center !important; min-width: 50px; cursor: pointer; background: transparent; border: none; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* Forzar el tamaño exacto de tus banderas al cargar tus links */
        .btn-pais img, .world-icon { width: 44px !important; height: 32px !important; border-radius: 6px; border: 2px solid transparent; object-fit: cover; display: block !important; }
        .btn-pais.active img, .btn-pais.active .world-icon { border-color: #4CAF50; box-shadow: 0 0 10px #4CAF50; }
        .btn-pais span { font-size: 10px; color: #777; margin-top: 5px; font-weight: bold; text-transform: uppercase; }
        .btn-pais.active span { color: #4CAF50; }
        
        /* Menú de Navegación Inferior Fijo e Inamovible */
        .radar-nav-bottom { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 3000; box-sizing: border-box; }
        .nav-btn { display: flex; align-items: center; justify-content: center; }
        .nav-btn a { font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; text-transform: uppercase; font-family: sans-serif; }
        
        /* Indicador táctico rojo parpadeante independiente */
        .dot { height: 8px; width: 8px; background-color: #ff0000; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #f00; animation: parpadeo 1.5s infinite; flex-shrink: 0; }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        /* ESTILO PARA EL BANNER DINÁMICO COMPLETAMENTE RESPONSIVO */
        .banner-radar {
            width: 100%;             
            max-width: 480px;        
            height: auto;            
            display: block;
            margin: 0 auto;          
            box-sizing: border-box;
            padding: 10px 15px;

        /* Contenedor para el contenido del index */

        .rl-card { margin-bottom: 30px; display: block; }

        /* ======================================================================
           NUEVOS ESTILOS PARA EL TICKER EN EL INDEX (MOVIMIENTO VELOZ Y LEGIBLE)
           ====================================================================== */
        .rss-container {
            background: #0b0e11;
            padding: 12px 15px;
            border-bottom: 1px solid #222;
            border-top: 1px solid #222;
            min-height: 60px;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
            width: 100%;
            max-width: 600px; /* Alineado al ancho del contenido central */
            margin: 10px auto 20px auto;
        }
        .rss-header { font-size: 0.75rem; color: #4CAF50; font-weight: bold; margin-bottom: 4px; letter-spacing: 1px; display: flex; align-items: center; z-index: 2; }
        .rss-wrapper-ticker { overflow: hidden; width: 100%; white-space: nowrap; display: flex; position: relative; }
        .rss-ticker { font-size: 0.95rem; color: #adbeaf; display: inline-block; padding-left: 100%; animation: ticker-scroll-fast 16s linear infinite; }
        .rss-ticker:hover { animation-play-state: paused; } /* Pausa al tocar para leer con calma */
        .rss-ticker a { color: #00ff66; text-decoration: none; font-weight: bold; margin-right: 50px; display: inline-block; white-space: nowrap; }
        .rss-ticker a:hover { text-decoration: underline; }

        @keyframes ticker-scroll-fast {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* CONTEXTO PARA EL REPRODUCTOR AUTOMÁTICO 100% AJUSTADO AL CELULAR */
        .video-container { 
            width: 100%;             /* 👈 Obliga al video a ocupar todo el ancho del celular */
            max-width: 600px;        /* 👈 Pone un tope elegante para que no se desarme en la PC */
            aspect-ratio: 16/9;      /* 👈 Mantiene la proporción perfecta de televisión */
            background: #000; 
            margin: 15px auto;       /* 👈 Separa el video del ticker y lo centra */
            position: relative; 
            overflow: hidden; 
            border-bottom: 1px solid #222; /* 👈 Línea sutil abajo, igual que en tu sección de TV */
            box-sizing: border-box; 
        }
        #main-video-player, #hls-video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; z-index: 2; }
        #main-video-player.active, #hls-video-player.active { display: block; }
        /* ======================================================================
           NUEVO CONTENEDOR DE NOTICIAS CON IMÁGENES (ESTILO RECOLECTOR VISUAL)
           ====================================================================== */
        .noticias-feed-container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            padding: 10px 15px;
            box-sizing: border-box;
            background: #000;
        }
        .feed-header-title {
            font-size: 0.85rem;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-left: 4px solid #4CAF50;
            padding-left: 10px;
        }
        /* Cada fila de noticia */
        .noticia-card-row {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #1a1a1a;
            text-decoration: none !important;
            color: inherit;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .noticia-card-row:hover {
            background: #0b0e11;
        }
        /* Contenedor fijo de la imagen */
        .noticia-img-box {
            flex: 0 0 90px;
            width: 90px;
            height: 65px;
            background: #111;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .noticia-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Textos de la derecha */
        .noticia-text-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .noticia-headline {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 500;
            line-height: 1.3;
            margin: 0;
        }
        .noticia-meta-date {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>

 // 🟢 MOTOR REPARADO: EXTRAE TÍTULOS, FECHAS E IMÁGENES XML SIN ERRORES

                        if (mediaContent) {
                            urlImagen = mediaContent.getAttribute("url") || "";
                        }

    // 2. MOTOR REPARADO: EXTRAE TÍTULOS, FECHAS E IMÁGENES XML
    // ======================================================================
    async function cargarSeñalRSS(codigoPais, etiquetaNombre) {
        const tickerTarget = document.getElementById('ticker-target');
        const listaTarget = document.getElementById('noticias-target-lista');
        const tagPaisNoticias = document.getElementById('radar-noticias-pais');

            const xmlDoc = parser.parseFromString(textoXml, "text/xml");
            const items = xmlDoc.getElementsByTagName("item");

            if (items.length > 0) {
                let bloqueTicker = '';
                let bloqueListaConFotos = '';

                for (let i = 0; i < Math.min(items.length, 12); i++) {
                    const item = items[i];
                    const titulo = item.getElementsByTagName("title")[0]?.textContent || item.getElementsByTagName("title")?.textContent || "";
                    const link = item.getElementsByTagName("link")[0]?.textContent || item.getElementsByTagName("link")?.textContent || "#";
                    const fechaRaw = item.getElementsByTagName("pubDate")[0]?.textContent || item.getElementsByTagName("pubDate")?.textContent || "";
                    
                    let urlImagen = '';
                    
                    const enclosure = item.getElementsByTagName("enclosure")[0];
                    if (enclosure) {
                        urlImagen = enclosure.getAttribute("url") || "";
                    }
                    
                    if (!urlImagen) {
                        const mediaContent = item.getElementsByTagNameNS("*", "content")[0];
                        if (mediaContent) {
                            urlImagen = mediaContent.getAttribute("url") || "";
                        }
                    }

                    if (!urlImagen) {
                        const mediaThumbnail = item.getElementsByTagNameNS("*", "thumbnail")[0];
                        if (mediaThumbnail) {
                            urlImagen = mediaThumbnail.getAttribute("url") || "";
                        }
                    }

                    if (!urlImagen) {
                        urlImagen = 'https://wikimedia.org';
                    }

                    let fechaCorta = "RECIENTE";
                    if (fechaRaw) {
                        const partesFecha = fechaRaw.split(' ');
                        if (partesFecha.length > 4) {
                            fechaCorta = `${partesFecha[4].substring(0,5)} hs - ${partesFecha[1]} ${partesFecha[2]}`;
                        }
                    }

                    const tituloLimpio = titulo.replace(/"/g, '&quot;');

                    bloqueTicker += `<a href="${link}" target="_blank">⚡ ${tituloLimpio}</a>`;

                    bloqueListaConFotos += `
                        <a href="${link}" target="_blank" class="noticia-card-row">
                            <div class="noticia-img-box">
                                <img src="${urlImagen}" alt="RadarLat">
                            </div>
                            <div class="noticia-text-box">
                                <h3 class="noticia-headline">${tituloLimpio}</h3>
                                <span class="noticia-meta-date">⏱️ ${fechaCorta} | ${etiquetaNombre.toUpperCase()}</span>
                            </div>
                        </a>
                    `;
                }

                if (tickerTarget && bloqueTicker !== '') tickerTarget.innerHTML = bloqueTicker;
                if (listaTarget && bloqueListaConFotos !== '') listaTarget.innerHTML = bloqueListaConFotos;
                
                if (tickerTarget) {
                    tickerTarget.style.animation = 'none';
                    tickerTarget.offsetHeight; 
                    tickerTarget.style.animation = 'ticker-scroll-fast 16s linear infinite';
                }
            } else {
                if (tickerTarget) tickerTarget.innerHTML = `<a>⚠️ No hay noticias para ${etiquetaNombre}.</a>`;
                if (listaTarget) listaTarget.innerHTML = `<p style='text-align:center; font-size:12px;'>No hay despachos visuales.</p>`;
            }
        } catch (error) {
            console.error(error);
            if (tickerTarget) tickerTarget.innerHTML = `<a>⚠️ Servidor fuera de rango.</a>`;
            if (listaTarget) listaTarget.innerHTML = `<p style='text-align:center; font-size:12px; color:red;'>Error de conexión satelital.</p>`;
        }
    }

    // ======================================================================
    // 3. 🟢 FUNCIÓN DE FILTRADO Y ACTUALIZACIÓN (ESTA PARTE FALTABA)
    // ======================================================================
    function filtrarRadar(codigoPais, elemento) {
        document.querySelectorAll('.btn-pais').forEach(btn => btn.classList.remove('active'));
        elemento.classList.add('active');
        
        const tagPais = document.getElementById('radar-pais-tag');
        const tickerTarget = document.getElementById('ticker-target');
        const textoPais = elemento.querySelector('span').innerText;
        
        if (tagPais) tagPais.innerText = textoPais;
        if (tickerTarget) tickerTarget.innerHTML = `<a>Conectando flujos de información y portales de ${textoPais}...</a>`;

        const tarjetas = document.querySelectorAll('.rl-card');
        tarjetas.forEach(tarjeta => {
            if (codigoPais === 'all') {
                tarjeta.style.display = 'block';
            } else {
                tarjeta.style.display = (tarjeta.getAttribute('data-pais') === codigoPais) ? 'block' : 'none';
            }
        });

        // Lanza la recarga del RSS
        cargarSeñalRSS(codigoPais, textoPais);
    }

    // ======================================================================
    // 4. DISPARADOR DE INICIO (ESTA PARTE TAMBIÉN FALTABA)
    // ======================================================================
    window.addEventListener('DOMContentLoaded', () => {
        // Enciende tu tómbola de video que ya tenías arriba en tu código
        if (typeof encenderCanalAleatorio === 'function') {
            encenderCanalAleatorio();
        }
        // Inicia el lector RSS con la opción global TODOS
        const botonInicial = document.querySelector('.btn-pais.active');
        if (botonInicial) {
            filtrarRadar('all', botonInicial);
        }
    });
    </script>
</body>
