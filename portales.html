        </div>
        <span id="rss-status" style="font-size: 10px; color: #444; text-transform: uppercase;">Actualizado</span>
    </div>

    <div id="rssContent" style="max-height: 250px; overflow-y: auto; padding-right: 5px; background: #000;">

<style>
    /* Esto evita que elementos externos se mezclen visualmente */
    .rss-radarlat-container { isolation: isolate; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .news-card { display: flex; gap: 12px; padding: 12px 5px; border-bottom: 1px solid #1a1a1a; transition: 0.2s; align-items: center; background: #000; }
    .news-card:hover { background: #0a0a0a; }
    .news-thumb { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; background: #222; flex-shrink: 0; }
    .news-text { flex-grow: 1; }
    .news-card a { color: #ffffff; text-decoration: none; font-size: 15px; line-height: 1.3; display: block; margin-bottom: 4px; font-weight: 500; }
    .news-card a:hover { color: #007bff; }
    .news-card span { color: #666; font-size: 11px; text-transform: uppercase; }
    #rssContent::-webkit-scrollbar { width: 4px; }
    #rssContent::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
</style>

<script>
(function() {
    const defaultRss = 'https://feeds.bbci.co.uk/mundo/latinoamerica/rss.xml';
    const refreshTime = 30 * 60 * 1000;

    async function fetchRSS() {
        const container = document.getElementById('rssContent');
        const status = document.getElementById('rss-status');
        
        try {
            const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(defaultRss)}&t=${new Date().getTime()}`);
            const data = await response.json();

            if (data.status === 'ok') {
                container.innerHTML = '';
                data.items.forEach(item => {
                    const article = document.createElement('div');
                    article.className = 'news-card';
                    const image = item.thumbnail || 'https://via.placeholder.com/80x60/1a1a1a/666666?text=RadarLat';
                    const date = new Date(item.pubDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    article.innerHTML = `
                        <img src="${image}" class="news-thumb" alt="news">
                        <div class="news-text">
                            <a href="${item.link}" target="_blank">${item.title}</a>
                            <span>Hoy • ${date} • BBC Mundo</span>
                        </div>`;
                    container.appendChild(article);
                });
                status.innerText = "Actualizado: " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }
        } catch (e) {
            console.error("Error RSS");
        }
    }
    fetchRSS();
    setInterval(fetchRSS, refreshTime);
})();

<script>
    async function filtrarRadar(codigoPais, elemento) {
        document.querySelectorAll('.btn-pais').forEach(btn => btn.classList.remove('active'));
        elemento.classList.add('active');
        
        const tarjetas = document.querySelectorAll('.rl-card');
        tarjetas.forEach(tarjeta => {
            if (codigoPais === 'all') {
                tarjeta.style.display = 'block';
            } else {
                tarjeta.style.display = (tarjeta.getAttribute('data-pais') === codigoPais) ? 'block' : 'none';
            }
        });

        const headerRSS = document.getElementById('rss-header-pais');
        const contenidoRSS = document.getElementById('rss-contenido-dinamico');
        let paisAProcesar = codigoPais;

          if (codigoPais === 'all') {
            headerRSS.innerText = "// CANAL_RSS: MONITOREO_GLOBAL_ALEATORIO";
            const codigosDisponibles = Object.keys(urlsFeedsReales);
            paisAProcesar = codigosDisponibles[Math.floor(Math.random() * codigosDisponibles.length)];
        } else {
            headerRSS.innerText = `// CANAL_RSS: MONITOREO_TACTICO_[${codigoPais.toUpperCase()}]`;
        }

        if (urlsFeedsReales[paisAProcesar]) {
            contenidoRSS.innerHTML = "Sincronizando feed táctico con el servidor del diario...";
            try {
                const proxyUrl = `rss2json.com{encodeURIComponent(urlsFeedsReales[paisAProcesar])}`;
                const respuesta = await fetch(proxyUrl);
                const datos = await respuesta.json();

                if (datos.status === 'ok' && datos.items.length > 0) {
                    const noticia = datos.items;
                    contenidoRSS.innerHTML = `<strong>NUEVO_TITULAR:</strong> ${noticia.title} — <a href="${noticia.link}" target="_blank">LEER EN EL DIARIO ></a>`;
                } else {
                    contenidoRSS.innerHTML = "ERROR: No se pudieron procesar los flujos de texto del feed.";
                }
            } catch (error) {
                contenidoRSS.innerHTML = "ERROR_CONEXION: Servidor de noticias no responde o tiene bloqueos perimetrales.";
            }
        } else {
            contenidoRSS.innerHTML = `NODO_VACÍO: Canal de noticias en vivo para [${paisAProcesar.toUpperCase()}] listo para conectar enlace XML.`;
        }
    }

       // CANDADO DE TAMAÑO FIJO EN 7MM (58PX)
    window.addEventListener('DOMContentLoaded', () => {
        const menuSuperior = document.querySelector('.radar-menu-superior');
        if (menuSuperior) {
            // Fuerza el tamaño físico absoluto de 58px para anular cualquier cálculo del navegador
            menuSuperior.style.height = '58px';
            menuSuperior.style.minHeight = '58px';
            menuSuperior.style.maxHeight = '58px';
        }
    });


      
    window.addEventListener('DOMContentLoaded', () => {
        filtrarRadar('all', document.querySelector('.btn-pais.active'));
    });
    </script>
