#rl-container-fuerza {
  width: 100%;
  overflow-x: auto;
  padding: 14px 0 10px 0;
  background-color: #030704; /* Fondo oscuro integrado al radar */
  -webkit-overflow-scrolling: touch;
}

/* Línea verde inferior característica de tu diseño */
#rl-container-fuerza::after {
  content: '';
  display: block;
  width: 100%;
  height: 2px;
  background-color: #00ff66;
  margin-top: 10px;
  opacity: 0.7;
}

#rl-container-fuerza::-webkit-scrollbar {
  display: none;
}

.rl-carrusel-centrado {
  display: flex;
  gap: 16px;
  padding: 0 16px;
  width: max-content;
}

.btn-pais {
  display: flex;
  flex-direction: column; /* Estructura vertical de tu imagen */
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  -webkit-tap-highlight-color: transparent;
}

/* Tipografía de los países (Pequeña, grisácea y centrada) */
.btn-pais span:last-child {
  font-family: 'Roboto Condensed', system-ui, sans-serif;
  font-size: 11px;
  font-weight: bold;
  color: #8fa095;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* Efecto activo: recuadro verde brillante idéntico a tu captura */
.btn-pais.active {

  border-radius: 4px;
}

.btn-pais.active span:last-child {
