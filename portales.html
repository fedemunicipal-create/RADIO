    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; padding-bottom: 100px; overflow-x: hidden; }
        #rl-container-fuerza { position: sticky; top: 0; width: 100%; background: #0b0e11; border-bottom: 2px solid #4CAF50; z-index: 2000; content-visibility: auto; contain-intrinsic-size: 0 62px; }
        .r1-carrusel-centrado { display: flex !important; flex-direction: row !important; overflow-x: auto !important; gap: 20px; padding: 10px 15px; align-items: center; -webkit-overflow-scrolling: touch; }
        .r1-carrusel-centrado::-webkit-scrollbar { display: none; }
        .btn-pais { flex: 0 0 auto; display: flex !important; flex-direction: column !important; align-items: center !important; min-width: 50px; cursor: pointer; background: transparent; border: none; padding: 0; -webkit-tap-highlight-color: transparent; }
        .btn-pais img, .world-icon { width: 44px; height: 32px; border-radius: 6px; border: 2px solid transparent; object-fit: cover; }
        .btn-pais.active img, .btn-pais.active .world-icon { border-color: #4CAF50; box-shadow: 0 0 10px #4CAF50; }
        .btn-pais span { font-size: 10px; color: #777; margin-top: 5px; font-weight: bold; text-transform: uppercase; }
        .btn-pais.active span { color: #4CAF50; }
        
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; overflow: hidden; border-bottom: 1px solid #222; }
        #main-video-player, #hls-video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
        #main-video-player.active, #hls-video-player.active { display: block; }
        
        .main-content { padding: 10px 0; }
        .rl-card { margin-bottom: 30px; display: block; content-visibility: auto; contain-intrinsic-size: 0 180px; }
        .country-header { font-size: 0.9rem; font-weight: bold; color: #fff; margin: 15px; text-transform: uppercase; border-left: 4px solid #4CAF50; padding-left: 12px; }
        .channels-scroll { display: flex; overflow-x: auto; gap: 15px; padding: 0 15px 10px; -webkit-overflow-scrolling: touch; }
        .channels-scroll::-webkit-scrollbar { display: none; }
        
        .logo-box { width: 110px; height: 110px; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; cursor: pointer; }
        .logo-box img { width: 80%; height: auto; object-fit: contain; }
    </style>
</head>

    <!-- Script de Control de Filtrado Dinámico -->
    <script>
    function filtrarRadar(codigoPais, elemento) {
        document.querySelectorAll('.btn-pais').forEach(btn => btn.classList.remove('active'));
        elemento.classList.add('active');
        
        const tarjetas = document.querySelectorAll('.rl-card');
        tarjetas.forEach(tarjeta => {
            if (codigoPais === 'all') {
                tarjeta.style.display = 'block';
            } else {
                if (tarjeta.getAttribute('data-pais') === codigoPais) {
                    tarjeta.style.display = 'block';
                } else {
                    tarjeta.style.display = 'none';
                }
            }
        });
    }

    function reproducirCanal(url, tipo) {
        const iframePlayer = document.getElementById('main-video-player');
        const hlsPlayer = document.getElementById('hls-video-player');

        if (tipo === 'iframe') {
            hlsPlayer.classList.remove('active');
            hlsPlayer.pause();
            iframePlayer.src = url;
            iframePlayer.classList.add('active');
        } else if (tipo === 'hls') {
            iframePlayer.classList.remove('active');
            iframePlayer.src = '';
            hlsPlayer.src = url;
            hlsPlayer.classList.add('active');
            hlsPlayer.play().catch(e => console.log("Autoplay bloqueado"));
        }
    }
    </script>
