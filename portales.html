<style>
/* Contenedor Base Estilo RadarLat */
#rl-container-fuerza {
  width: 100%;
  overflow-x: auto;
  padding: 16px 0 0 0;
  background-color: #000000; /* Fondo Negro */
  -webkit-overflow-scrolling: touch;
  border-bottom: 2px solid #00ff66; /* Línea verde al 100% */
  box-sizing: border-box;
}

#rl-container-fuerza::-webkit-scrollbar {
  display: none;
}

.rl-carrusel-centrado {
  display: flex;
  gap: 24px;
  padding: 0 20px 16px 20px;
  width: max-content;
}

.btn-pais {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
}

/* CAJA DE ICONOS CON TAMAÑO DUPLICADO (144px x 92px) */
.radar-icon-box {
  width: 144px;   
  height: 92px;
  background: linear-gradient(135deg, #06150a, #010502);
  border: 1px solid #005522; /* Borde verde apagado */
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #00aa44; /* Icono verde por defecto */
  box-sizing: border-box;
  padding: 12px;
  transition: all 0.15s ease;
}

.radar-icon-box svg {
  width: 100%;
  height: 100%;
}

/* Tipografía Consola de Comando */
.btn-pais span {
  font-family: 'Courier New', Courier, monospace;
  font-size: 14px;
  font-weight: bold;
  color: #008833;
  letter-spacing: 1px;
}

/* Enfoque Activo: El Icono e Identificador se iluminan en Verde Neón */
.btn-pais.active .radar-icon-box {
  border-color: #00ff66;
  color: #00ff66;
  background: linear-gradient(135deg, #0d3116, #020a04);
  box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
  outline: 2px solid #00ff66;
  outline-offset: 4px;
}

.btn-pais.active span {
  color: #00ff66;
  text-shadow: 0 0 8px #00ff66;
}

/* --- ESTILOS DE LA LISTA DE ARCHIVOS TERMINAL --- */
#contenedor-archivos-radar {
  background-color: #000000;
  padding: 30px 20px;
  font-family: 'Courier New', Courier, monospace;
}

.bloque-pais {
  display: block; /* Modificado dinámicamente por JS */
  border: 1px solid #003311;
  background-color: #020603;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 4px;
}

.radar-header-bloque {
  color: #00ff66;
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 15px;
  text-shadow: 0 0 5px rgba(0, 255, 102, 0.4);
}

.lista-terminal {
  list-style: none;
  padding: 0;
  margin: 0;
}

.lista-terminal li {
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.prompt {
  color: #00ff66;
}

.lista-terminal a {
  color: #00cc55;
  text-decoration: none;
  font-size: 15px;
}

.lista-terminal a:hover {
  color: #00ff66;
  text-shadow: 0 0 5px #00ff66;
}
</style>

<script>
function navegarYFiltrar(codigoPais, elemento) {
  // Ejecuta la función nativa que ya tengas implementada en tu sitio
  if (typeof filtrarRadar === "function") {
    filtrarRadar(codigoPais, elemento);
  }

  // Intercambia estados visuales de los botones
  document.querySelectorAll('.btn-pais').forEach(btn => btn.classList.remove('active'));
  elemento.classList.add('active');

  // Filtra las cajas de archivos en la parte inferior
  const bloques = document.querySelectorAll('.bloque-pais');
  if (codigoPais === 'all') {
    bloques.forEach(bloque => bloque.style.display = 'block');
  } else {
    bloques.forEach(bloque => {
      if (bloque.getAttribute('data-pais') === codigoPais) {
        bloque.style.display = 'block';
      } else {
        bloque.style.display = 'none';
      }
    });
  }

  // Desplazamiento táctil suave hacia la sección de descargas
  document.getElementById('contenedor-archivos-radar').scrollIntoView({ 
    behavior: 'smooth', 
    block: 'start' 
  });
}
</script>
