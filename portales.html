<style>
/* Contenedor Base Estilo RadarLat */
#rl-container-fuerza {
  width: 100%;
  overflow-x: auto;
  padding: 16px 0 0 0;
  background-color: #000000;
  -webkit-overflow-scrolling: touch;
  border-bottom: 2px solid #00ff66; /* Línea verde que llega al 100% de la pantalla */
}

#rl-container-fuerza::-webkit-scrollbar {
  display: none;
}

.rl-carrusel-centrado {
  display: flex;
  gap: 24px;
  padding: 0 20px 16px 20px;
  width: max-content;
}

.btn-pais {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
}

/* DOBLE TAMAÑO: Iconos grandes de 144px de ancho */
.btn-pais img, 
.world-icon {
  width: 144px;   
  height: 92px;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid #11331a;
  box-sizing: border-box;
}

.world-icon {
  background: linear-gradient(135deg, #0b2212, #020a04);
  border: 1px solid #00aa44;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
}

/* Tipografía de Consola de Comando */
.btn-pais span {
  font-family: 'Courier New', Courier, monospace;
  font-size: 14px;
  font-weight: bold;
  color: #008833;
  letter-spacing: 1px;
}

/* Enfoque Activo: Recuadro Verde Fluorescente */
.btn-pais.active img,
.btn-pais.active .world-icon {
  outline: 3px solid #00ff66;
  outline-offset: 4px;
}

.btn-pais.active span {
  color: #00ff66;
  text-shadow: 0 0 8px #00ff66;
}

/* --- ESTÉTIQUES DE ARCHIVOS INTEGRADAS --- */
#contenedor-archivos-radar {
  background-color: #000000;
  padding: 30px 20px;
  font-family: 'Courier New', Courier, monospace;
}

.bloque-pais {
  display: block;
  border: 1px solid #003311;
  background-color: #020603;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 4px;
}

.radar-header-bloque {
  color: #00ff66;
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 15px;
  text-shadow: 0 0 5px rgba(0, 255, 102, 0.4);
}

.lista-terminal {
  list-style: none;
  padding: 0;
  margin: 0;
}

.lista-terminal li {
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.prompt {
  color: #00ff66;
}

.lista-terminal a {
  color: #00cc55;
  text-decoration: none;
  font-size: 15px;
}

.lista-terminal a:hover {
  color: #00ff66;
  text-shadow: 0 0 5px #00ff66;
}
</style>

<script>
function navegarYFiltrar(codigoPais, elemento) {
  if (typeof filtrarRadar === "function") {
    filtrarRadar(codigoPais, elemento);
  }

  document.querySelectorAll('.btn-pais').forEach(btn => btn.classList.remove('active'));
  elemento.classList.add('active');

  const bloques = document.querySelectorAll('.bloque-pais');
  
  if (codigoPais === 'all') {
    bloques.forEach(bloque => bloque.style.display = 'block');
  } else {
    bloques.forEach(bloque => {
      if (bloque.getAttribute('data-pais') === codigoPais) {
        bloque.style.display = 'block';
      } else {
        bloque.style.display = 'none';
      }
    });
  }

  document.getElementById('contenedor-archivos-radar').scrollIntoView({ 
    behavior: 'smooth', 
    block: 'start' 
  });
}
</script>
