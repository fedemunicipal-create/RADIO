<style>

  border: 1px solid #1c2e22;
  box-sizing: border-box;
}

.world-icon {
  background: linear-gradient(135deg, #153a21, #081c10);
  border: 1px solid #00ff66;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

  font-family: 'Roboto Condensed', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  font-weight: 800;
  color: #7a8c80;
  letter-spacing: 0.8px;
}

/* Estado de Selección (Recuadro Verde Fluorescente) */

.btn-pais.active .world-icon {
  outline: 3px solid #00ff66;
  outline-offset: 4px;
}

.btn-pais.active span {
  color: #00ff66;

<script>
function navegarYFiltrar(codigoPais, elemento) {
  // 1. Ejecutar tu función existente del radar (para no romper tu lógica previa)
  if (typeof filtrarRadar === "function") {
    filtrarRadar(codigoPais, elemento);
  }

  // 2. Gestionar clases visuales del botón seleccionado
  document.querySelectorAll('.btn-pais').forEach(btn => btn.classList.remove('active'));
  elemento.classList.add('active');

  // 3. Filtrar la lista de archivos integrada
  const bloques = document.querySelectorAll('.bloque-pais');
  
  if (codigoPais === 'all') {
    bloques.forEach(bloque => bloque.style.display = 'block');
  } else {
    bloques.forEach(bloque => {
      if (bloque.getAttribute('data-pais') === codigoPais) {
        bloque.style.display = 'block';
      } else {
        bloque.style.display = 'none';
      }
    });
  }

  // 4. Desplazamiento automático suave hacia la sección de archivos
  document.getElementById('contenedor-archivos-radar').scrollIntoView({ 
    behavior: 'smooth', 
    block: 'start' 
  });
}
</script>
