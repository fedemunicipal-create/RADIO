
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADARLAT NOTICIAS</title>
    
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; padding-bottom: 120px; overflow-x: hidden; }
        #rl-container-fuerza { position: sticky; top: 0; width: 100%; background: #0b0e11; border-bottom: 2px solid #4CAF50; z-index: 2000; content-visibility: auto; contain-intrinsic-size: 0 62px; }
        .r1-carrusel-centrado { display: flex !important; flex-direction: row !important; overflow-x: auto !important; gap: 20px; padding: 10px 15px; align-items: center; -webkit-overflow-scrolling: touch; }
        .r1-carrusel-centrado::-webkit-scrollbar { display: none; }
        .btn-pais { flex: 0 0 auto; display: flex !important; flex-direction: column !important; align-items: center !important; min-width: 50px; cursor: pointer; background: transparent; border: none; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        .btn-pais img, .world-icon { width: 44px !important; height: 32px !important; border-radius: 6px; border: 2px solid transparent; object-fit: cover; display: block !important; }
        .btn-pais.active img, .btn-pais.active .world-icon { border-color: #4CAF50; box-shadow: 0 0 10px #4CAF50; }
        .btn-pais span { font-size: 10px; color: #777; margin-top: 5px; font-weight: bold; text-transform: uppercase; }
        .btn-pais.active span { color: #4CAF50; }
        
        /* SECTOR RSS MARQUEE TICKER OPTIMIZADO */
        .rss-container { background: #0b0e11; padding: 10px 15px; border-bottom: 1px solid #222; overflow: hidden; white-space: nowrap; position: relative; display: flex; align-items: center; }
        .rss-header { font-size: 0.75rem; color: #4CAF50; font-weight: bold; letter-spacing: 1px; background: #0b0e11; padding-right: 15px; z-index: 10; display: flex; align-items: center; flex-shrink: 0; }
        .rss-wrapper { overflow: hidden; width: 100%; display: flex; }
        
        /* Animación infinita del Ticker */
        .rss-ticker { display: inline-block; padding-left: 100%; animation: ticker-scroll 25s linear infinite; font-family: monospace; font-size: 0.95rem; color: #adbeaf; }
        .rss-ticker:hover { animation-play-state: paused; } /* Detiene el scroll al pasar el mouse/dedo */
        .rss-ticker a { color: #00ff66; text-decoration: none; font-weight: bold; margin-right: 40px; display: inline-block; }
        .rss-ticker a:hover { text-decoration: underline; }

        @keyframes ticker-scroll {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Contenedor de Portales */
        .main-content { padding: 10px 0; }
        .rl-card { margin-bottom: 30px; display: block; content-visibility: auto; contain-intrinsic-size: 0 180px; }
        .country-header { font-size: 0.9rem; font-weight: bold; color: #fff; margin: 15px; text-transform: uppercase; border-left: 4px solid #4CAF50; padding-left: 12px; }
        .channels-scroll { display: flex !important; overflow-x: auto !important; gap: 15px !important; padding: 0 15px 10px !important; -webkit-overflow-scrolling: touch; }
        .channels-scroll::-webkit-scrollbar { display: none; }
        
        /* Tarjetas de Diarios */
        .portal-link { text-decoration: none !important; color: inherit !important; display: block; flex: 0 0 auto !important; }
        .logo-box { width: 130px; height: 130px; background: #111417; border: 1px solid #222; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        .portal-link:hover .logo-box { border-color: #4CAF50; box-shadow: 0 0 8px rgba(76, 175, 80, 0.4); }
        .logo-box img { width: 100%; height: 65px; object-fit: contain; margin-bottom: 6px; background: #fff; border-radius: 6px; padding: 4px; box-sizing: border-box; display: block; }
        .logo-box span { font-size: 12px; font-weight: bold; text-align: center; color: #adbeaf; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }

        /* Menú de Navegación Inferior */
        .radar-nav-bottom { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 3000; box-sizing: border-box; }
        .nav-btn { display: flex; align-items: center; justify-content: center; }
        .nav-btn a { font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; text-transform: uppercase; font-family: sans-serif; color: #fff; text-decoration: none; }
        
        .dot { height: 8px; width: 8px; background-color: #ff0000; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #f00; animation: parpadeo 1.5s infinite; flex-shrink: 0; }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <!-- Menú Superior -->
    <div id="rl-container-fuerza">
        <div class="r1-carrusel-centrado">
            <div class="btn-pais active" onclick="filtrarRadar('all', this)"><div class="world-icon" style="background:#222; display:flex; align-items:center; justify-content:center;">🌐</div><span>TODOS</span></div>
            <div class="btn-pais" onclick="filtrarRadar('ar', this)"><img src="https://flagcdn.com"><span>ARG</span></div>
            <div class="btn-pais" onclick="filtrarRadar('cl', this)"><img src="https://flagcdn.com"><span>CHI</span></div>
            <div class="btn-pais" onclick="filtrarRadar('uy', this)"><img src="https://flagcdn.com"><span>URU</span></div>
            <div class="btn-pais" onclick="filtrarRadar('br', this)"><img src="https://flagcdn.com"><span>BRA</span></div>
            <div class="btn-pais" onclick="filtrarRadar('mx', this)"><img src="https://flagcdn.com"><span>MEX</span></div>
            <div class="btn-pais" onclick="filtrarRadar('es', this)"><img src="https://flagcdn.com"><span>ESP</span></div>
            <div class="btn-pais" onclick="filtrarRadar('us', this)"><img src="https://flagcdn.com"><span>USA</span></div>
        </div>
    </div>

    <!-- SECTOR RSS TICKER -->
    <div class="rss-container">
        <div class="rss-header">
            <span class="dot"></span><span id="rss-pais-tag">GLOBAL</span>:
        </div>
        <div class="rss-wrapper">
            <div id="ticker-target" class="rss-ticker">Cargando últimas noticias internacionales...</div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL (MOCKUP PORTALES) -->
    <div class="main-content">
        <div class="rl-card" data-country="ar">
            <div class="country-header">Argentina</div>
            <div class="channels-scroll">
                <a href="#" class="portal-link"><div class="logo-box"><span>Infobae</span></div></a>
                <a href="#" class="portal-link"><div class="logo-box"><span>Clarín</span></div></a>
            </div>
        </div>
        <div class="rl-card" data-country="mx">
            <div class="country-header">México</div>
            <div class="channels-scroll">
                <a href="#" class="portal-link"><div class="logo-box"><span>El Universal</span></div></a>
                <a href="#" class="portal-link"><div class="logo-box"><span>Milenio</span></div></a>
            </div>
        </div>
    </div>

    <!-- MENÚ INFERIOR -->
    <div class="radar-nav-bottom">
        <div class="nav-btn">
            <a href="#"><span class="dot"></span>EN VIVO</a>
        </div>
    </div>

    <!-- SCRIPT DE AUTOMATIZACIÓN RSS -->
    <script>
        // Fuentes RSS de alta confiabilidad por país (puedes cambiarlas por las que prefieras)
        const rssFuentes = {
            all: 'https://google.com', // Global
            ar: 'https://clarin.com',
            cl: 'https://biobiochile.cl',
            uy: 'https://elobservador.com.uy',
            br: 'https://globo.com',
            mx: 'https://eluniversal.com.mx',
            es: 'https://elpais.com',
            us: 'https://nytimes.com'
        };

        // Función principal que lee el RSS usando la API gratuita rss2json
        async function cargarRSS(codigoPais, nombrePais) {
            const tickerTarget = document.getElementById('ticker-target');
            const tagPais = document.getElementById('rss-pais-tag');
            
            tagPais.innerText = nombrePais.toUpperCase();
            tickerTarget.innerHTML = "Actualizando radar de noticias...";
            
            const urlFeed = rssFuentes[codigoPais] || rssFuentes['all'];
            // Usamos rss2json para convertir el XML del diario a un JSON legible por JavaScript
            const apiURL = `https://rss2json.com{encodeURIComponent(urlFeed)}`;

            try {
                const response = await fetch(apiURL);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    let tickerHTML = '';
                    // Tomamos un máximo de 10 noticias del feed
                    data.items.slice(0, 10).forEach(item => {
                        // Reemplaza las comillas para evitar errores de sintaxis
                        const titulo Clean = item.title.replace(/"/g, '&quot;');
                        tickerHTML += `<a href="${item.link}" target="_blank">🔥 ${tituloClean}</a>`;
                    });
                    tickerTarget.innerHTML = tickerHTML;
                    
                    // Reiniciar la animación CSS dinámicamente para evitar bugs visuales
                    tickerTarget.style.animation = 'none';
                    tickerTarget.offsetHeight; // Truco de reflujo del navegador
                    tickerTarget.style.animation = 'ticker-scroll 35s linear infinite';
                } else {
                    tickerTarget.innerHTML = `<a>⚠️ No se pudieron cargar alertas para ${nombrePais} en este momento.</a>`;
                }
            } catch (error) {
                console.error("Error cargando el RSS:", error);
                tickerTarget.innerHTML = `<a>⚠️ Error de conexión de red al leer feed de ${nombrePais}.</a>`;
            }
        }

        // Función del filtro de tu carrusel superior (Modificada para activar el RSS)
        function filtrarRadar(pais, elemento) {
            // 1. Manejo visual de botones activos
            document.querySelectorAll('.btn-pais').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');

            // 2. Filtrar las tarjetas de diarios abajo
            const tarjetas = document.querySelectorAll('.rl-card');
            tarjetas.forEach(tarjeta => {
                if (pais === 'all' || tarjeta.getAttribute('data-country') === pais) {
                    tarjeta.style.display = 'block';
                } else {
                    tarjeta.style.display = 'none';
                }
            });

            // 3. Ejecutar la actualización del Ticker RSS según el país seleccionado
            const textoPais = elemento.querySelector('span').innerText;
            cargarRSS(pais, textoPais);
        }

        // Carga inicial por defecto (Noticias Globales) al abrir la web
        window.addEventListener('DOMContentLoaded', () => {
            cargarRSS('all', 'GLOBAL');
        });
    </script>

</body>
</html>
